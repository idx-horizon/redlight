{% extends "base.html" %}

{% block content %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Breathing</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .visualizer-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .breathing-box {
            width: 130px;
            height: 130px;
            border: 4px solid #38bdf8;
            border-radius: 16px;
            position: absolute;
            animation: boxCycle 16s infinite ease-in-out;
        }

        .phase-label {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            z-index: 2;
        }

        @keyframes boxCycle {
            0% { transform: scale(1); border-color: #38bdf8; }        /* Inhale start */
            25% { transform: scale(1.6); border-color: #4ade80; }     /* Hold full */
            50% { transform: scale(1.6); border-color: #fbbf24; }     /* Exhale start */
            75% { transform: scale(1); border-color: #f87171; }       /* Hold empty */
            100% { transform: scale(1); border-color: #38bdf8; }      /* Loop end */
        }
    </style>
</head>
<body>

    <div class="visualizer-container">
        <div class="breathing-box"></div>
        <div class="phase-label" id="phaseDisplay">Inhale</div>
    </div>

    <script>
        const phaseEl = document.getElementById('phaseDisplay');
        const phases = ['Inhale', 'Hold', 'Exhale', 'Hold'];
        let step = 0;

        function cyclePhase() {
            phaseEl.textContent = phases[step];
            step = (step + 1) % phases.length;
        }

        cyclePhase();
        setInterval(cyclePhase, 4000);
    </script>
</body>
{% endblock %}
